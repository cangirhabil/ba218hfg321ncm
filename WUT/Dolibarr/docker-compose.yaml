services:
  db:
    image: mariadb:10.6
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: always
    volumes:
      - db:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_PASSWORD=dolibarr123
      - MYSQL_DATABASE=dolibarr
      - MYSQL_USER=dolibarr
    networks:
      - dolibarr_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10

  app:
    image: dolibarr/dolibarr:latest
    restart: always
    ports:
      - 8085:80
    links:
      - db
    volumes:
      - dolibarr_html:/var/www/html
      - dolibarr_documents:/var/www/documents
      - /etc/localtime:/etc/localtime:ro
      - ../../shared-tmpfs:/shared-tmpfs
      - ./setup-entrypoint.sh:/setup-entrypoint.sh:ro
    environment:
      - DOLI_DB_HOST=db
      - DOLI_DB_USER=dolibarr
      - DOLI_DB_PASSWORD=dolibarr123
      - DOLI_DB_NAME=dolibarr
      - DOLI_ADMIN_LOGIN=admin
      - DOLI_ADMIN_PASSWORD=admin123
      - DOLI_URL_ROOT=http://localhost:8085
      - DOLI_INSTALL_AUTO=1
      - DOLI_PROD=0
      - WWW_USER_ID=1000
      - WWW_GROUP_ID=1000
      - PHP_INI_DATE_TIMEZONE=Europe/Amsterdam
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dolibarr_network
    entrypoint: ["/setup-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      timeout: 30s
      retries: 5
      interval: 10s

volumes:
  dolibarr_html:
  dolibarr_documents:
  db:

networks:
  dolibarr_network:
    driver: bridge
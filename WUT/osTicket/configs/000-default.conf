<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html
    
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Enable rewrite module
    RewriteEngine On
    
    # osTicket specific configuration
    <Directory /var/www/html/setup>
        # Allow access to setup directory
        Require all granted
    </Directory>
    
    <Directory /var/www/html/include>
        # Deny access to include directory
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>